name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test dell'API
        run: npm test
      - name: Build del sito
        run: npm run build -w @motix/web
